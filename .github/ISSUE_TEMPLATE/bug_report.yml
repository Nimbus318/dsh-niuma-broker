name: Bug report
description: Report a bug in Niuma Broker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short one-line summary of the issue
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DeepSeek Harness (DSH) version
      placeholder: e.g. 0.2.2-rc.5 or 0.2.3-alpha.2
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux (Web / Docker / Desktop)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behavior?
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual behavior
      description: What happened instead of what you expected? Attach sanitized logs if helpful.
    validations:
      required: true
