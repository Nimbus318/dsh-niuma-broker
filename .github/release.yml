changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Refactors
      labels:
        - refactor
    - title: Documentation
      labels:
        - documentation
    - title: CI & Tooling
      labels:
        - ci
    - title: Other Changes
      labels:
        - "*"
